name: Deploy to GitHub Pages

on: 
  push:
    branches: [main]
  workflow_dispatch:
  
permissions:
  contents: write
  pages: write
  id-token: write
  
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    if: github.event_name == 'workflow_dispatch' || github.repository_owner != 'Donutelo'
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: npm ci && npm run build
      - name: Deploy (só funciona em repo público ou plano pago)
      - uses: peaceiris/actions-gh-pages@v3
      - uses: actions/cache@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
